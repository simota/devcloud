# Rust workspace for devcloud.
#
# Each migrated service lives under `services/<svc>` as a workspace member and
# shares this root's `target/` directory.
[workspace]
resolver = "2"
members = [
  "orchestrator",
  "services/applicationautoscaling",
  "services/bigquery",
  "services/cloudrun",
  "services/dashboard",
  "services/dynamodb",
  "services/event-relay",
  "services/gcs",
  "services/lambda",
  "services/mail",
  "services/mailbox",
  "services/pubsub",
  "services/redis",
  "services/redis-control",
  "services/redshift",
  "services/s3",
  "services/sigv4a",
  "services/sqs",
  "services/ssm",
  "services/sts",
]

# The hand-written P-256 arithmetic is ~50x slower unoptimized, which makes
# SigV4a tests in every dependent crate take seconds per signature.
[profile.dev.package.devcloud-sigv4a]
opt-level = 3
