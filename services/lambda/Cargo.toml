[package]
name = "devcloud-lambda"
version = "0.1.0"
edition = "2021"
description = "Local AWS Lambda emulator for devcloud: Lambda REST API (functions, invoke, tags) executing python/node handlers as local processes."

[lib]
name = "devcloud_lambda"
path = "src/lib.rs"

[[bin]]
name = "devcloud-lambda"
path = "src/main.rs"

[dependencies]
devcloud-hostguard = { path = "../hostguard" }
# Same hand-rolled HTTP/1.1-on-tokio approach as the other AWS-protocol crates.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# Raw DEFLATE decoding for deployment-package zip entries (the zip container
# itself is parsed by src/zip.rs).
miniz_oxide = "0.8"
# killpg: stop a handler's whole process group on timeout/exit.
libc = "0.2"
# Shared local S3 file store, for Code.S3Bucket/S3Key deployment packages.
devcloud-s3 = { path = "../s3" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "process", "time"] }
