[package]
name = "devcloud-cloudrun"
version = "0.1.0"
edition = "2021"
description = "Local Cloud Run emulator for devcloud: Cloud Run Admin API v2 (services, revisions, operations, IAM) plus a reverse proxy that runs each service's container command as a local process."

[lib]
name = "devcloud_cloudrun"
path = "src/lib.rs"

[dependencies]
devcloud-hostguard = { path = "../hostguard" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
# killpg: stop an instance's whole process group.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "process", "time"] }
