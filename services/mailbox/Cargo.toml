[package]
name = "devcloud-mailbox"
version = "0.1.0"
edition = "2021"
description = "Standalone devcloud mail catcher (SMTP + web UI) with a MailHog-compatible HTTP API."

[[bin]]
name = "devcloud-mailbox"
path = "src/main.rs"

[dependencies]
devcloud-mail = { path = "../mail" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "net", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
encoding_rs = "0.8"
include_dir = "0.7"
