[package]
name = "devcloud-sts"
version = "0.1.0"
edition = "2021"
description = "devcloud STS emulator (AWS Query)."

[lib]
name = "devcloud_sts"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
