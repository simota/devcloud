name: Isolated audit verification

on:
  push:
    branches: [audit/verification-20260915]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  AUDIT_BASE: 0d031df3a5417a24855e44e2c25de2f88f0f1129
  AUDIT_TREE: 50c90a10c124baf5c4c2e024f5cee123c5b9473c
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '0'
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_ACCESS_KEY_ID: dev
  AWS_SECRET_ACCESS_KEY: dev
  AWS_DEFAULT_REGION: us-east-1

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      fix_sha: ${{ steps.publish.outputs.fix_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: audit-input
          persist-credentials: false
          clean: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AUDIT_BASE }}
          path: repo
          fetch-depth: 0
          clean: false
      - name: Install compiler prerequisite and reproducible npm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          npm install --global npm@10.9.2
          npm --version
      - name: Restore and verify audited source changes
        working-directory: repo
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, os
          parts = sorted(pathlib.Path('../audit-input/.audit/patch').glob('*.b64'))
          assert len(parts) == 6
          compressed = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '13a303b5cbf9e8e39d0f230753580ae6bac6491ec45c99cdd78a6d45fcbbc3fc'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'audit-fixes.mbox').write_bytes(gzip.decompress(compressed))
          PY
          git status --short
          test -z "$(git status --porcelain)"
          git config user.name 'Devcloud Audit'
          git config user.email 'devcloud-audit@users.noreply.github.com'
          git am "$RUNNER_TEMP/audit-fixes.mbox"
          test "$(git rev-parse HEAD^{tree})" = "$AUDIT_TREE"
          git diff --check "$AUDIT_BASE" HEAD
          git diff --name-only "$AUDIT_BASE" HEAD
      - name: Full build and regression verification
        working-directory: repo
        run: |
          mkdir -p "$RUNNER_TEMP/audit-core"
          rustc --version | tee "$RUNNER_TEMP/audit-core/versions.log"
          cargo --version | tee -a "$RUNNER_TEMP/audit-core/versions.log"
          protoc --version | tee -a "$RUNNER_TEMP/audit-core/versions.log"
          node --version | tee -a "$RUNNER_TEMP/audit-core/versions.log"
          npm --version | tee -a "$RUNNER_TEMP/audit-core/versions.log"
          cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/audit-core/fmt.log"
          cargo check --workspace 2>&1 | tee "$RUNNER_TEMP/audit-core/check.log"
          cargo test --workspace 2>&1 | tee "$RUNNER_TEMP/audit-core/tests.log"
          cargo clippy --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/audit-core/clippy.log"
          (cd web/dashboard && npm install && npm run typecheck && npm run build) 2>&1 | tee "$RUNNER_TEMP/audit-core/dashboard.log"
          git status --short | tee "$RUNNER_TEMP/audit-core/final-status.txt"
          git diff --stat | tee "$RUNNER_TEMP/audit-core/final-diff-stat.txt"
          git diff > "$RUNNER_TEMP/audit-core/final-worktree.diff"
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Publish only the isolated fix branch
        id: publish
        working-directory: repo
        run: |
          branch=audit/config-time-boundaries-20260915
          git fetch origin "refs/heads/$branch"
          existing=$(git rev-parse FETCH_HEAD)
          if [[ "$existing" = "$AUDIT_BASE" ]]; then
            git push origin "HEAD:refs/heads/$branch"
            fix_sha=$(git rev-parse HEAD)
          elif [[ "$(git rev-parse FETCH_HEAD^{tree})" = "$AUDIT_TREE" ]]; then
            fix_sha=$existing
          else
            echo 'Refusing to overwrite concurrent branch changes' >&2
            exit 1
          fi
          echo "fix_sha=$fix_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$fix_sha" > "$RUNNER_TEMP/audit-core/fix-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-fixed-core
          path: ${{ runner.temp }}/audit-core
          retention-days: 7
  acceptance:
    needs: validate-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [s3, gcs, bigquery, pubsub, dynamodb, redshift, sqs, mail, redis, applicationautoscaling, misc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: audit-input
          persist-credentials: false
          clean: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate-and-publish.outputs.fix_sha }}
          path: repo
          persist-credentials: false
          clean: false
      - name: Install local-only test dependencies
        working-directory: repo
        env:
          GROUP: ${{ matrix.group }}
        run: |
          packages=(protobuf-compiler ripgrep netcat-openbsd)
          if [[ "$GROUP" = redis ]]; then packages+=(redis-server); fi
          if [[ "$GROUP" = redshift ]]; then packages+=(postgresql postgresql-client); fi
          sudo apt-get update -qq
          sudo apt-get install -y "${packages[@]}"
          npm install --global npm@10.9.2
          if [[ "$GROUP" = redshift ]]; then pg_config --bindir >> "$GITHUB_PATH"; fi
          case "$GROUP" in
            s3|sqs|dynamodb|applicationautoscaling)
              python3 -m venv "$RUNNER_TEMP/aws-cli"
              "$RUNNER_TEMP/aws-cli/bin/pip" install awscli awscli-local
              echo "$RUNNER_TEMP/aws-cli/bin" >> "$GITHUB_PATH"
              ;;
          esac
          cd web/dashboard
          npm install
      - name: Run all discovered final stages and standalone E2Es
        working-directory: repo
        env:
          GROUP: ${{ matrix.group }}
        run: python3 ../audit-input/.audit/run-gates.py "$GROUP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-gates-${{ matrix.group }}
          path: ${{ runner.temp }}/audit-${{ matrix.group }}
          retention-days: 7
