name: Isolated audit verification

on:
  push:
    branches: [audit/verification-20260915]

permissions:
  contents: read

env:
  AUDIT_REF: 0d031df3a5417a24855e44e2c25de2f88f0f1129
  CARGO_TERM_COLOR: never

jobs:
  offline-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AUDIT_REF }}
          persist-credentials: false
          clean: false
      - name: Prepare compiler and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          root="$RUNNER_TEMP/offline-tooling"
          mkdir -p "$root/rust" "$root/protoc/bin" "$root/protoc/lib" "$root/protoc/include"
          sysroot=$(rustc --print sysroot)
          cp -a "$sysroot/bin" "$sysroot/lib" "$root/rust/"
          cp /usr/bin/protoc "$root/protoc/bin/"
          cp -L /usr/lib/x86_64-linux-gnu/libprotobuf.so.32 /usr/lib/x86_64-linux-gnu/libprotoc.so.32 "$root/protoc/lib/"
          cp -a /usr/include/google "$root/protoc/include/"
          cargo vendor --locked "$root/vendor" > "$root/vendor-config.toml"
          (cd web/dashboard && npm install)
          tar -czf "$root/dashboard-node-modules.tar.gz" -C web/dashboard node_modules
          tar -czf "$RUNNER_TEMP/offline-tooling.tar.gz" -C "$root" .
          sha256sum "$RUNNER_TEMP/offline-tooling.tar.gz" > "$RUNNER_TEMP/offline-tooling.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-offline-tooling
          path: |
            ${{ runner.temp }}/offline-tooling.tar.gz
            ${{ runner.temp }}/offline-tooling.sha256
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AUDIT_REF }}
          persist-credentials: false
          clean: false
      - name: Install build prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
      - name: Environment and gate discovery
        run: |
          mkdir -p "$RUNNER_TEMP/audit-results"
          git status
          git diff
          rustc --version
          cargo --version
          protoc --version
          node --version
          npm --version
          find scripts -maxdepth 2 -name verify.sh -print
          find scripts -maxdepth 1 -name '*-e2e.sh' -print
      - name: Rust format baseline
        id: fmt
        run: cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/audit-results/fmt.log"
      - name: Rust check baseline
        id: check
        if: always()
        run: cargo check --workspace 2>&1 | tee "$RUNNER_TEMP/audit-results/check.log"
      - name: Rust tests baseline
        id: tests
        if: always()
        run: cargo test --workspace 2>&1 | tee "$RUNNER_TEMP/audit-results/tests.log"
      - name: Rust clippy baseline
        id: clippy
        if: always()
        run: cargo clippy --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/audit-results/clippy.log"
      - name: Dashboard install baseline
        id: npm_install
        if: always()
        working-directory: web/dashboard
        run: npm install 2>&1 | tee "$RUNNER_TEMP/audit-results/npm-install.log"
      - name: Dashboard typecheck baseline
        id: typecheck
        if: always()
        working-directory: web/dashboard
        run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/audit-results/typecheck.log"
      - name: Dashboard build baseline
        id: build
        if: always()
        working-directory: web/dashboard
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/audit-results/build.log"
      - name: Record baseline outcomes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/audit-results"
          printf '%s\n' 'fmt=${{ steps.fmt.outcome }}' 'check=${{ steps.check.outcome }}' 'tests=${{ steps.tests.outcome }}' 'clippy=${{ steps.clippy.outcome }}' 'npm_install=${{ steps.npm_install.outcome }}' 'typecheck=${{ steps.typecheck.outcome }}' 'build=${{ steps.build.outcome }}' > "$RUNNER_TEMP/audit-results/outcomes.txt"
          git diff --stat > "$RUNNER_TEMP/audit-results/generated-diff-stat.txt"
          git status --short > "$RUNNER_TEMP/audit-results/final-status.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-baseline-outcomes
          path: ${{ runner.temp }}/audit-results
          retention-days: 7
          if-no-files-found: error
