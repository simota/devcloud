name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust and dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Install dashboard dependencies
        working-directory: web/dashboard
        run: npm ci
      - name: Test dashboard events and state
        working-directory: web/dashboard
        run: npm test
      - name: Build dashboard
        working-directory: web/dashboard
        run: npm run build
      - name: Check embedded dashboard assets
        run: |
          git diff --exit-code -- services/dashboard/assets/react
          test -z "$(git ls-files --others --exclude-standard services/dashboard/assets/react)"
      - name: Check independent service builds
        run: |
          for package in devcloud-s3 devcloud-gcs devcloud-bigquery devcloud-dynamodb devcloud-redshift devcloud-applicationautoscaling; do
            cargo check --locked -p "$package"
          done
      - name: Run Rust tests
        run: cargo test --locked --workspace --no-fail-fast
      - name: Build CLI for browser test
        run: cargo build --locked -p devcloud-orchestrator
      - name: Install browser
        working-directory: web/dashboard
        run: npx playwright install --with-deps chromium
      - name: Test dashboard in Chromium
        working-directory: web/dashboard
        run: npm run test:browser
      - name: Upload browser verification
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dashboard-browser
          path: target/dashboard-browser
          if-no-files-found: ignore
          retention-days: 30
      - name: Check Rust lints
        run: cargo clippy --locked --workspace --all-targets

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - name: Audit dashboard dependencies
        working-directory: web/dashboard
        run: |
          npm ci --ignore-scripts
          npm audit
      - name: Audit Rust dependencies
        env:
          AUDIT_VERSION: '0.22.2'
          AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
        run: |
          archive="$RUNNER_TEMP/cargo-audit.tgz"
          curl --fail --silent --show-error --location \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v$AUDIT_VERSION/cargo-audit-x86_64-unknown-linux-musl-v$AUDIT_VERSION.tgz" \
            --output "$archive"
          printf '%s  %s\n' "$AUDIT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-musl-v$AUDIT_VERSION/cargo-audit" audit
